name: NGS original dataset reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-original-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ngs_pipeline_gospodinov

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ngs_pipeline_gospodinov/requirements.txt

      - name: Install bioinformatics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bwa samtools bcftools
          python -m pip install -r requirements.txt
          {
            echo '## Tool versions'
            samtools --version | head -n 1
            bcftools --version | head -n 1
            bwa 2>&1 | head -n 4 || true
            python --version
          } | tee tool_versions.txt

      - name: Preserve committed variant baseline
        run: |
          mkdir -p reproduction_baseline
          cp results/variant_pipeline/variants.tsv reproduction_baseline/published_variants.tsv
          test "$(wc -l < reproduction_baseline/published_variants.tsv)" -eq 19

      - name: Download and verify original Zenodo input data
        run: |
          mkdir -p data/variant_demo reference/variant_demo
          curl --fail --location --retry 4 --retry-all-errors --output data/variant_demo/mutant_R1.fastq 'https://zenodo.org/records/582600/files/mutant_R1.fastq?download=1'
          curl --fail --location --retry 4 --retry-all-errors --output data/variant_demo/mutant_R2.fastq 'https://zenodo.org/records/582600/files/mutant_R2.fastq?download=1'
          curl --fail --location --retry 4 --retry-all-errors --output reference/variant_demo/wildtype.fna 'https://zenodo.org/records/582600/files/wildtype.fna?download=1'
          printf '%s\n' \
            '32ad7e3698f3f78fd35047cfd8718ea9  data/variant_demo/mutant_R1.fastq' \
            '6df54a24aed461dcf70c6a79a56f18f7  data/variant_demo/mutant_R2.fastq' \
            '80fe318fdf4cdd0fee4a244f520a0c54  reference/variant_demo/wildtype.fna' \
            > reproduction_baseline/zenodo_md5.txt
          md5sum --check reproduction_baseline/zenodo_md5.txt | tee input_checksum_results.txt

      - name: Run original bacterial variant pipeline
        run: bash scripts/run_variant_pipeline.sh

      - name: Verify BAM and VCF structure
        run: |
          samtools quickcheck -v results/variant_pipeline/mutant.sorted.bam
          bcftools index --nrecords results/variant_pipeline/normalized.vcf.gz
          bcftools norm -f reference/variant_demo/wildtype.fna -c e -Ou results/variant_pipeline/normalized.vcf.gz > /dev/null

      - name: Compare all called variants to committed baseline
        run: |
          python scripts/verify_original_variants.py \
            reproduction_baseline/published_variants.tsv \
            results/variant_pipeline/normalized.vcf.gz \
            reproduction_comparison.tsv \
            reproduction_summary.md

      - name: Include reproducibility summary in GitHub run
        if: always()
        run: |
          if [ -f reproduction_summary.md ]; then cat reproduction_summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-dataset-reproduction-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            ngs_pipeline_gospodinov/tool_versions.txt
            ngs_pipeline_gospodinov/input_checksum_results.txt
            ngs_pipeline_gospodinov/reproduction_baseline/published_variants.tsv
            ngs_pipeline_gospodinov/reproduction_baseline/zenodo_md5.txt
            ngs_pipeline_gospodinov/reproduction_comparison.tsv
            ngs_pipeline_gospodinov/reproduction_summary.md
            ngs_pipeline_gospodinov/results/variant_pipeline/variants.tsv
            ngs_pipeline_gospodinov/results/variant_pipeline/flagstat.txt
            ngs_pipeline_gospodinov/results/variant_pipeline/variant_stats.txt
            ngs_pipeline_gospodinov/results/variant_pipeline/coverage_summary.tsv
            ngs_pipeline_gospodinov/results/variant_pipeline/enhanced_qc_report.html
            ngs_pipeline_gospodinov/results/variant_pipeline/bwa.log
