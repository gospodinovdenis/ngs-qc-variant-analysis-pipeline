
name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ngs_pipeline_gospodinov

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ngs_pipeline_gospodinov/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Test published results
        run: python -m unittest discover -s tests -v

      - name: Test QC reporting
        run: python scripts/test_qc_pipeline.py
